    <style>
/* Forever Love: 3D romantic memory card
   Design tokens first, then layers from back to front:
   background -> particles -> slideshow -> intro -> UI overlay. */

:root {
  --blush: #fce8ef;
  --rose: #e8527a;
  --rose-deep: #b8245a;
  --ink: #5a2140;
  --gold: #f6c177;
  --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
  --font-script: 'Great Vibes', cursive;
  --font-body: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: var(--app-h, 100%);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--blush);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── Ambient background ── */
.bg-layer {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 18% 14%, #ffd6e4 0, transparent 55%),
    radial-gradient(ellipse at 86% 82%, #ffc2d6 0, transparent 50%),
    linear-gradient(160deg, #fff1f5, #fce8ef 45%, #f9d3e1);
  animation: aura 14s ease-in-out infinite alternate;
}
@keyframes aura {
  to { filter: hue-rotate(-12deg) saturate(1.15); transform: scale(1.06); }
}

.vignette {
  position: fixed; inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(120, 20, 70, 0.22));
}

#bgParts, #fxCanvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
#fxCanvas { z-index: 30; }

/* ── 3D slideshow stage ── */
.slideshow {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  perspective: 1400px;
  transform-style: preserve-3d;
}

.slide {
  position: absolute;
  width: var(--card-w, min(78vw, 400px));
  opacity: 0;
  pointer-events: none;
  transform-style: preserve-3d;
  will-change: transform, opacity;
  transition: transform 0.9s var(--ease), opacity 0.7s ease;
}
.slide.before { transform: translate3d(-70%, 0, -260px) rotateY(62deg) scale(0.8); }
.slide.after  { transform: translate3d(70%, 0, -260px) rotateY(-62deg) scale(0.8); }
.slide.active {
  opacity: 1;
  transform: translate3d(0, 0, 0) rotateY(0) rotateZ(var(--tilt, 0deg)) scale(1);
}

.card {
  position: relative;
  padding: 14px 14px 0;
  border-radius: 6px;
  background: #fff;
  box-shadow:
    0 30px 60px -20px rgba(150, 20, 80, 0.45),
    0 6px 18px rgba(150, 20, 80, 0.18);
}
.slide.active .card { animation: floaty 5s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-8px); } }

.photo {
  position: relative;
  display: grid; place-items: center;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  border-radius: 3px;
  background: linear-gradient(145deg, #ffd1e0, #f7a1bd);
}
.photo img {
  display: block;
  width: 100%; height: 100%;
  object-fit: cover;
}
/* Shake: quick wiggle, a short rest, repeat */
.slide.active .photo img {
  animation: shake 2.4s ease-in-out infinite;
  transform-origin: 50% 60%;
}
@keyframes shake {
  0%, 100% { transform: translate(0, 0) rotate(0); }
  4%  { transform: translate(-4px, 1px) rotate(-1.6deg); }
  8%  { transform: translate(4px, -1px) rotate(1.6deg); }
  12% { transform: translate(-4px, 1px) rotate(-1.4deg); }
  16% { transform: translate(4px, -1px) rotate(1.4deg); }
  20% { transform: translate(-3px, 0) rotate(-1deg); }
  24% { transform: translate(3px, 0) rotate(1deg); }
  28% { transform: translate(-1px, 0) rotate(-0.4deg); }
  32% { transform: translate(0, 0) rotate(0); }
}
.photo.no-photo::after { content: '💖'; font-size: 4rem; }

.card figcaption {
  padding: 12px 8px 16px;
  text-align: center;
  font-family: var(--font-script);
  font-size: clamp(1.7rem, 6vw, 2.2rem);
  line-height: 1.15;
  color: var(--rose-deep);
}

.deco {
  position: absolute;
  font-size: 1.6rem;
  animation: bob 3s ease-in-out infinite;
  pointer-events: none;
}
.deco.d1 { top: -16px; right: -10px; }
.deco.d2 { bottom: 38px; left: -16px; animation-delay: -1.2s; }
@keyframes bob { 50% { transform: translateY(-7px) rotate(8deg); } }

/* Finale card: words instead of a photo */
.slide.finale .card {
  padding: 0;
  background: linear-gradient(150deg, #ff7aa2, #e8527a 55%, #b8245a);
  color: #fff;
}
.finale-body {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  aspect-ratio: 4 / 5;
  padding: 28px;
  text-align: center;
}
.finale-body .big-heart { font-size: 3.4rem; animation: beat 1.3s ease-in-out infinite; }
.finale-body h2 {
  font-family: var(--font-script);
  font-size: clamp(2.4rem, 10vw, 3.4rem);
  font-weight: 400;
  line-height: 1.05;
}
.finale-body p { font-size: 1rem; line-height: 1.5; opacity: 0.92; }
.finale-body .credit {
  margin-top: 6px;
  font-family: var(--font-script);
  font-size: 1.5rem;
  line-height: 1.2;
  opacity: 0.85;
}
@keyframes beat { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.18); } 40% { transform: scale(1); } }

/* ── Intro splash ── */
.intro {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
  padding: 24px;
  text-align: center;
  background: linear-gradient(160deg, #fff1f5, #fbd0df);
  transition: opacity 0.9s ease, visibility 0s linear 0.9s;
}
.intro.hide { opacity: 0; visibility: hidden; }
.intro-heart { font-size: 4.2rem; animation: beat 1.3s ease-in-out infinite; }
.intro-text {
  font-family: var(--font-script);
  font-size: clamp(2.2rem, 8vw, 3.6rem);
  font-weight: 400;
  color: var(--rose-deep);
  animation: introIn 1.2s var(--ease) both;
}
@keyframes introIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } }

/* ── UI overlay ── */
.pbar {
  position: fixed; left: 0; z-index: 20;
  top: env(safe-area-inset-top, 0px);
  height: 4px;
  background: linear-gradient(90deg, var(--rose), var(--gold));
  border-radius: 0 4px 4px 0;
  box-shadow: 0 0 10px rgba(232, 82, 122, 0.6);
  transition: width 0.2s linear;
}

.rbtn {
  position: fixed; left: 50%; z-index: 40;
  bottom: max(28px, env(safe-area-inset-bottom));
  padding: 12px 26px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px -8px rgba(150, 20, 80, 0.45);
  color: var(--rose-deep);
  font: 600 1rem var(--font-body);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 16px);
  transition: opacity 0.5s ease, transform 0.5s var(--ease), background 0.25s;
}
.rbtn.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.rbtn:hover { background: rgba(255, 255, 255, 0.85); }
.rbtn:focus-visible { outline: 2px solid var(--rose-deep); outline-offset: 3px; }

/* ── Small screens and reduced motion ── */
body.is-phone .card { padding: 10px 10px 0; }
body.is-phone .card figcaption {
  padding: 8px 6px 12px;
  font-size: clamp(1.5rem, 7vw, 1.9rem);
}
body.is-phone .deco { font-size: 1.3rem; }
body.is-phone .intro-heart { font-size: 3.4rem; }
body.is-phone .rbtn {
  padding: 11px 22px;
  bottom: max(20px, env(safe-area-inset-bottom));
}
body.is-phone .slide.before { transform: translate3d(-62%, 0, -200px) rotateY(55deg) scale(0.8); }
body.is-phone .slide.after  { transform: translate3d(62%, 0, -200px) rotateY(-55deg) scale(0.8); }

body.is-landscape .finale-body { gap: 6px; padding: 14px; }
body.is-landscape .finale-body .big-heart { font-size: 2.2rem; }
body.is-landscape .finale-body h2 { font-size: 1.9rem; }
body.is-landscape .finale-body p { font-size: 0.8rem; line-height: 1.35; }
body.is-landscape .finale-body .credit { font-size: 1.15rem; margin-top: 0; }
body.is-landscape .intro-heart { font-size: 2.6rem; }
body.is-landscape .intro-text { font-size: 2rem; }
body.is-landscape .rbtn { bottom: 10px; padding: 8px 18px; }

body.is-touch .rbtn:hover { background: rgba(255, 255, 255, 0.55); }

@media (prefers-reduced-motion: reduce) {
  .bg-layer, .intro-heart, .big-heart, .deco, .slide.active .card, .slide.active .photo img { animation: none; }
  .slide { transition: opacity 0.4s ease; }
  .slide.before, .slide.after { transform: none; }
}
    </style>
</head>

    <div class="intro" id="intro" role="banner">
        <div class="intro-heart" aria-hidden="true">💕</div>
        <h1 class="intro-text">For you, with all my heart...</h1>
    </div>

    <!-- Animated Ambient Background Layer -->
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Particle Engine Canvas -->
    <canvas id="bgParts" aria-hidden="true"></canvas>

    <!-- 3D Slideshow Stage -->

    <!-- UI Overlay Components -->
    <div class="pbar" id="pbar" style="width:0" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    <button class="rbtn" id="rbtn" aria-label="Replay Slideshow">Replay 💕</button>

  ];

  const FINALE = {
    title: 'Forever & always',
    text: 'Thank you for every moment. I love you more than words can say.',
    credit: 'Made with care by Hansel',
  };

  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = (id) => document.getElementById(id);
  const rand = (min, max) => min + Math.random() * (max - min);
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  const stage = $('ss');
  const intro = $('intro');
  const pbar = $('pbar');
  const rbtn = $('rbtn');
  const partsCanvas = $('bgParts');
  const pctx = partsCanvas.getContext('2d');

  // Confetti and cannons get their own canvas above the slideshow.
  const fxCanvas = document.createElement('canvas');
  fxCanvas.id = 'fxCanvas';
  fxCanvas.setAttribute('aria-hidden', 'true');
  document.body.appendChild(fxCanvas);
  const fctx = fxCanvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  let slides = [];
  let index = 0;
  let elapsed = 0;
  let state = 'intro'; // intro | playing | finished
  let lastPct = -1;

  /* ───────── Slides ───────── */

  function buildPhotoSlide(data, i) {
    const el = document.createElement('article');
    el.className = 'slide';
    el.style.setProperty('--tilt', `${(i % 2 ? 1 : -1) * (1.2 + ((i * 0.7) % 1.8))}deg`);

    const card = document.createElement('figure');
    card.className = 'card';

    const photo = document.createElement('div');
    photo.className = 'photo';
    const img = new Image();
    img.alt = data.alt;
    img.decoding = 'async';
    let triedFallback = false;
    img.addEventListener('error', () => {
      if (!triedFallback && data.fallback) {
        triedFallback = true;
        img.src = data.fallback;
      } else {
        img.remove();
        photo.classList.add('no-photo');
      }
    });
    img.src = data.img;
    photo.appendChild(img);

    const caption = document.createElement('figcaption');
    caption.textContent = data.caption;

    card.append(photo, caption);
    el.append(card, decoration('d1', '✨'), decoration('d2', '🌸'));
    return el;
  }

  function buildFinaleSlide() {
    const el = document.createElement('article');
    el.className = 'slide finale';
    el.innerHTML =
      '<figure class="card"><div class="finale-body">' +
      '<div class="big-heart" aria-hidden="true">❤️</div>' +
      '<h2></h2><p></p><p class="credit"></p></div></figure>';
    el.querySelector('h2').textContent = FINALE.title;
    el.querySelector('p').textContent = FINALE.text;
    el.querySelector('.credit').textContent = FINALE.credit;
    el.appendChild(decoration('d1', '💖'));
    el.appendChild(decoration('d2', '✨'));
    return el;
  }

  function decoration(cls, emoji) {
    const span = document.createElement('span');
    span.className = `deco ${cls}`;
    span.setAttribute('aria-hidden', 'true');
    span.textContent = emoji;
    return span;
  }

  function show(i) {
    index = Math.max(0, Math.min(i, slides.length - 1));
    elapsed = 0;
    slides.forEach((el, j) => {
      el.classList.toggle('active', j === index);
      el.classList.toggle('before', j < index);
      el.classList.toggle('after', j > index);
      el.setAttribute('aria-hidden', j === index ? 'false' : 'true');
    });

    if (index === slides.length - 1) {
      finish();
    } else if (state === 'finished') {
      state = 'playing';
      rbtn.classList.remove('show');
    }
  }

  const next = () => { if (state !== 'intro' && index < slides.length - 1) show(index + 1); };
  const prev = () => { if (state !== 'intro' && index > 0) show(index - 1); };

  function finish() {
    if (state === 'finished') return;
    state = 'finished';
    rbtn.classList.add('show');
    setTimeout(() => { if (state === 'finished') celebrate(); }, 500);
  }

  function replay() {
    clearFx();
    rbtn.classList.remove('show');
    state = 'playing';
    show(0);
  }

  function updateProgress() {
    let pct = 0;
    if (state === 'finished') pct = 100;
    else if (state === 'playing') {
      pct = ((index + Math.min(elapsed / CONFIG.SLIDE_DURATION, 1)) / (slides.length - 1)) * 100;
    }
    pbar.style.width = `${pct}%`;
    const rounded = Math.round(pct);
    if (rounded !== lastPct) {
      lastPct = rounded;
      pbar.setAttribute('aria-valuenow', String(rounded));
    }
  }

  /* ───────── Floating hearts ───────── */

  let particles = [];

  function spawnParticle(initial) {
    const size = rand(10, 30) * (layout.phone ? 0.75 : 1);
    return {
      x0: rand(0, W),
      y: initial ? rand(0, H) : H + size,
      size,
      speed: rand(0.025, 0.07),   // px per ms
      amp: rand(10, 35),          // sideways wobble
      phase: rand(0, Math.PI * 2),
      freq: rand(0.0006, 0.0016),
      hue: rand(328, 356),
      alpha: rand(0.25, 0.6),
      age: 0,
    };
  }

  function drawHeart(ctx, x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s * 0.7, y - s * 0.1, x - s * 0.25, y - s * 0.55, x, y - s * 0.2);
    ctx.bezierCurveTo(x + s * 0.25, y - s * 0.55, x + s * 0.7, y - s * 0.1, x, y + s * 0.35);
    ctx.fill();
  }

  function drawParticles(dt) {
    pctx.clearRect(0, 0, W, H);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.age += dt;
      p.y -= p.speed * dt;
      const x = p.x0 + Math.sin(p.phase + p.age * p.freq) * p.amp;
      if (p.y < -p.size) { particles[i] = spawnParticle(false); continue; }

      // Fade in near the bottom, fade out toward the top.
      const fade = Math.min(1, (H - p.y) / (H * 0.15), p.y / (H * 0.3));
      pctx.fillStyle = `hsla(${p.hue}, 80%, 66%, ${Math.max(0, p.alpha * fade)})`;
      drawHeart(pctx, x, p.y, p.size);
    }
  }

  /* ───────── Finale: confetti rain and emoji cannons ───────── */

  const CONFETTI_COLORS = ['#e8527a', '#ff9bb8', '#f6c177', '#ffffff', '#b8245a', '#ffd6e4'];
  const CANNON_EMOJI = ['💖', '🎉', '✨', '🌸', '💕', '🎊'];
  let fxItems = [];
  let fxRunning = false;

  function celebrate() {
    const scale = REDUCED_MOTION ? 0.4 : 1;
    for (let i = 0; i < 160 * scale; i++) {
      fxItems.push({
        kind: 'confetti',
        x: rand(0, W), y: rand(-H * 0.4, -10),
        vx: rand(-0.8, 0.8), vy: rand(2, 4.6),
        w: rand(6, 12), h: rand(4, 8),
        rot: rand(0, Math.PI * 2), vr: rand(-0.15, 0.15),
        sway: rand(0, Math.PI * 2),
        color: pick(CONFETTI_COLORS),
      });
    }
    fireCannons();
    setTimeout(fireCannons, 700);
    startFx();
  }

  function fireCannons() {
    const count = REDUCED_MOTION ? 8 : 26;
    for (const side of [-1, 1]) {
      const originX = side === -1 ? 0 : W;
      for (let i = 0; i < count; i++) {
        const angle = (-rand(35, 80) * Math.PI) / 180;
        const speed = rand(12, 22) * Math.min(1, H / 700 + 0.35);
        fxItems.push({
          kind: 'emoji',
          x: originX, y: H,
          vx: Math.cos(angle) * speed * -side, // left cannon fires right, right cannon fires left
          vy: Math.sin(angle) * speed,
          size: rand(18, 34),
          emoji: pick(CANNON_EMOJI),
          life: 0, maxLife: rand(110, 170),
        });
      }
    }
    startFx();
  }

  function startFx() {
    if (fxRunning) return;
    fxRunning = true;
    let last = performance.now();
    const step = (now) => {
      const k = Math.min((now - last) / 16.67, 3);
      last = now;
      fctx.clearRect(0, 0, W, H);

      fxItems = fxItems.filter((it) => {
        if (it.kind === 'confetti') {
          it.sway += 0.05 * k;
          it.x += (it.vx + Math.sin(it.sway) * 0.9) * k;
          it.y += it.vy * k;
          it.rot += it.vr * k;
          if (it.y > H + 20) return false;
          fctx.save();
          fctx.translate(it.x, it.y);
          fctx.rotate(it.rot);
          fctx.fillStyle = it.color;
          fctx.fillRect(-it.w / 2, -it.h / 2, it.w, it.h);
          fctx.restore();
          return true;
        }
        it.life += k;
        it.vy += 0.35 * k;
        it.vx *= Math.pow(0.985, k);
        it.x += it.vx * k;
        it.y += it.vy * k;
        if (it.life > it.maxLife || it.y > H + 40) return false;
        fctx.globalAlpha = Math.max(0, Math.min(1, (it.maxLife - it.life) / 40));
        fctx.font = `${it.size}px serif`;
        fctx.textAlign = 'center';
        fctx.textBaseline = 'middle';
        fctx.fillText(it.emoji, it.x, it.y);
        fctx.globalAlpha = 1;
        return true;
      });

      if (fxItems.length) requestAnimationFrame(step);
      else { fxRunning = false; fctx.clearRect(0, 0, W, H); }
    };
    requestAnimationFrame(step);
  }

  function clearFx() {
    fxItems = [];
    fctx.clearRect(0, 0, W, H);
  }

  /* ───────── Layout, input, main loop ───────── */

  const layout = { phone: false, landscape: false, touch: false };

  function detectLayout() {
    const vv = window.visualViewport;
    const w = Math.round(vv ? vv.width : window.innerWidth);
    const h = Math.round(vv ? vv.height : window.innerHeight);
    layout.landscape = w > h;
    layout.phone = w <= 600 || (h <= 500 && w <= 950);
    layout.touch = window.matchMedia('(pointer: coarse)').matches;

    // Fit the card to the space left under the UI.
    const reserved = layout.phone ? (layout.landscape ? 24 : 96) : 120;
    const maxWidth = layout.phone ? w * (layout.landscape ? 0.5 : 0.84) : 400;
    const byHeight = (h - reserved - 43) / 1.25;
    const cardWidth = Math.max(150, Math.min(maxWidth, byHeight, 420));

    const root = document.documentElement;
    root.style.setProperty('--app-h', `${h}px`);
    root.style.setProperty('--card-w', `${Math.round(cardWidth)}px`);
    document.body.classList.toggle('is-phone', layout.phone);
    document.body.classList.toggle('is-landscape', layout.phone && layout.landscape);
    document.body.classList.toggle('is-touch', layout.touch);
    return { w, h };
  }

  function resize() {
    const { w, h } = detectLayout();
    dpr = Math.min(window.devicePixelRatio || 1, layout.phone ? 1.5 : 2);
    W = w;
    H = h;
    for (const c of [partsCanvas, fxCanvas]) {
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
    }
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const target = REDUCED_MOTION
      ? 12
      : Math.round(CONFIG.PARTICLE_COUNT * (layout.phone ? 0.6 : 1));
    if (particles.length > target) particles.length = target;
    while (particles.length < target) particles.push(spawnParticle(true));
  }

  function bindInput() {
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        next();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prev();
      } else if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage({ type: 'forever-love:close' }, '*');
      }
    });

    let startX = 0, startY = 0;
    document.addEventListener('touchstart', (e) => {
      startX = e.changedTouches[0].clientX;
      startY = e.changedTouches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? next : prev)();
    }, { passive: true });

    rbtn.addEventListener('click', replay);
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 250));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  }

  function init() {
    slides = [...SLIDES_DATA.map(buildPhotoSlide), buildFinaleSlide()];
    slides.forEach((el) => stage.appendChild(el));

    resize();

    bindInput();
    show(0);

    setTimeout(() => {
      intro.classList.add('hide');
      state = 'playing';
      elapsed = 0;
    }, CONFIG.INTRO_DURATION);

    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(now - last, 100);
      last = now;
      if (state === 'playing' && !document.hidden) {
        elapsed += dt;
        if (elapsed >= CONFIG.SLIDE_DURATION) next();
      }
      updateProgress();
      drawParticles(dt);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  init();
})();
    </script>
</body>
